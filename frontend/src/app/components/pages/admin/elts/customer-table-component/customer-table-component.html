<div class="row mt-4">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h2 class="h5 mb-0">Clients</h2>

        <!-- 🔍 Barre de recherche -->
        <div class="input-group input-group-sm" style="width: 250px">
          <input type="text" 
                 class="form-control" 
                 placeholder="Rechercher..."
                 [(ngModel)]="searchTerm"
                 (input)="onSearchChange()">
          <span class="input-group-text">
            <i class="fas fa-search"></i>
          </span>
        </div>
      </div>

      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-sm table-hover">
            <thead class="table-light">
              <tr>
                <th>ID Client</th>
                <th>Nom complet</th>
                <th>Téléphone</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let customer of customers">
                <td>{{ customer.id }}</td>
                <td>{{ customer.fullname }}</td>
                <td>{{ customer.phone }}</td>
                <td>
                  <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-primary" (click)="onAction('view', customer)">
                      <i class="fas fa-eye"></i>
                    </button>
                    <button class="btn btn-outline-success" (click)="onAction('edit', customer)">
                      <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-outline-danger" (click)="onAction('delete', customer)">
                      <i class="fas fa-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <app-pagination
          [config]="paginationConfig"
          [showTotal]="true"
          [showPageSizeOptions]="true"
          alignment="between"
          (pageChange)="onPageChange($event)"
        ></app-pagination>
      </div>
    </div>
  </div>
</div>
