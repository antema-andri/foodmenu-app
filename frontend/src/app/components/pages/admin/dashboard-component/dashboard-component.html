<div class="wrapper">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h3>FoodAdmin</h3>
    </div>

    <div class="sidebar-menu">
      <ul>
        <li><a routerLink="/admin" class="active"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
        <li><a routerLink="/admin/orders"><i class="fas fa-utensils"></i> <span>Plats</span></a></li>
        <li><a routerLink="/admin/customers"><i class="fas fa-users"></i> <span>Clients</span></a></li>
        <li><a routerLink="/admin/menu"><i class="fas fa-concierge-bell"></i> <span>Menus</span></a></li>
        <li><a routerLink="/admin/stats"><i class="fas fa-chart-bar"></i> <span>Statistiques</span></a></li>
        <li><a routerLink="/admin/settings"><i class="fas fa-cog"></i> <span>Paramètres</span></a></li>
      </ul>
    </div>
  </div>

  <!-- Main -->
  <div class="main-content">
    <header class="header">
      <div class="header-left">
        <h1>Gestion des Commandes</h1>
      </div>

      <div class="header-right">
        <div class="user-dropdown" (click)="toggleUserMenu()">
          <div class="user-dropdown-toggle">
            <div class="user-avatar">AD</div>
            <span class="user-name">Admin</span>
            <i class="fas fa-chevron-down"></i>
          </div>

          <div class="dropdown-menu" [class.show]="menuOpen">
            <a class="dropdown-item">
              <i class="fas fa-user me-2"></i>Mon profil
            </a>
            <a class="dropdown-item">
              <i class="fas fa-cog me-2"></i>Paramètres
            </a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" (click)="logout()" style="cursor: pointer;">
              <i class="fas fa-sign-out-alt me-2"></i>Déconnexion
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Ici, TON CONTENU DYNAMIQUE -->
    <router-outlet></router-outlet>

  </div>

</div>
