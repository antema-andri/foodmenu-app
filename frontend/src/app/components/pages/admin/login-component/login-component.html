<div class="d-flex align-items-center justify-content-center min-vh-100 px-3"
     style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">

  <div class="card shadow-lg" style="max-width: 400px; border-radius: 15px; overflow: hidden;">
    
    <!-- Header -->
    <div class="text-white text-center py-4"
         style="background: linear-gradient(135deg, #2c3e50 0%, #1a2530 100%);">
      <div class="d-flex justify-content-center align-items-center mb-2">

        <div class="bg-primary d-flex align-items-center justify-content-center me-2"
             style="width: 50px; height: 50px; border-radius: 10px; font-size: 1.5rem;">
          <i class="fas fa-utensils"></i>
        </div>

        <div class="fs-3 fw-bold">FoodAdmin</div>
      </div>
      <h1 class="fs-5 m-0">Espace Administrateur</h1>
    </div>

    <!-- Body -->
    <div class="card-body p-4">

      <!-- Alert -->
      @if(showError) {
      <div class="alert alert-danger d-flex align-items-center">
        <i class="fas fa-exclamation-circle me-2 icon-center"></i>
        <span>Nom d'utilisateur ou mot de passe incorrect</span>
      </div>
      }

      <form (ngSubmit)="login()" [formGroup]="form">

        <!-- Username -->
        <div class="mb-3">
          <label class="form-label">Nom d'utilisateur</label>

          <div class="position-relative">
            <span class="input-icon">
              <i class="fas fa-user text-secondary"></i>
            </span>

            <input type="text"
                formControlName="username"
                class="form-control ps-5 pe-5"
                placeholder="Entrez votre nom d'utilisateur"
                required>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>

          <div class="position-relative">
            <span class="input-icon"><i class="fas fa-lock text-secondary"></i></span>
            <input [type]="passwordVisible ? 'text' : 'password'"
                formControlName="password" 
                class="form-control ps-5 pe-5" 
                required>

            <button type="button"
                class="btn-eye"
                (click)="togglePassword()">
              <i class="fas" [ngClass]="passwordVisible ? 'fa-eye-slash' : 'fa-eye'" style="line-height:1;"></i>
            </button>
          </div>
        </div>

        <!-- Options -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <!-- <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Se souvenir de moi</label>
          </div> -->
          <a class="text-primary fw-medium">Mot de passe oublié ?</a>
        </div>

        <!-- Button -->
        <button [disabled]="form.invalid || isLoading" class="btn btn-primary w-100 py-2 fs-5 fw-semibold">
          Se connecter
        </button>

      </form>
    </div>
  </div>
</div>
