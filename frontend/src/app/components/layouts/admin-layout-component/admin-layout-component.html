      <div class="header-right">
        <div class="dropdown">
          <!-- Bouton du dropdown -->
          <button class="btn d-flex align-items-center bg-transparent border-0 p-0" 
                  type="button" 
                  id="userDropdown" 
                  data-bs-toggle="dropdown" 
                  aria-expanded="false">
            <div class="user-avatar me-2">{{ initialsName }}</div>
            <span class="user-name me-2">{{ user?.fullname }}</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          
          <!-- Menu du dropdown -->
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li>
              <a class="dropdown-item" style="cursor: pointer;">
                <i class="fas fa-user me-2"></i>Mon profil
              </a>
            </li>
            <li>
              <a class="dropdown-item" style="cursor: pointer;">
                <i class="fas fa-cog me-2"></i>Paramètres
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a (click)="logout()" class="dropdown-item" style="cursor: pointer;">
                <i class="fas fa-sign-out-alt me-2"></i>Déconnexion
              </a>
            </li>
          </ul>
        </div>
      </div>
