spring.application.name=foodmenu
spring.profiles.active=${ACTIVE_PROFILE:dev}

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=${POSTGRES_HIBERNATE_DLL}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.address=0.0.0.0
server.port=8080
base.url=http://${server.address}:${server.port}/

jwt.private-key=${RSA_PRIVATE_KEY}
jwt.public-key=${RSA_PUBLIC_KEY}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
