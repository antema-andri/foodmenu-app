<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page {
            size: A4 landscape;
            margin: 2cm;

            @top-center {
                content: "Tableau des Choix - Repas";
                font-size: 16px;
                font-weight: bold;
            }

            @bottom-right {
                content: "Page " counter(page) " sur " counter(pages);
                font-size: 10px;
            }
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .table-container {
            width: 100%;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #34495e;
        }

        th {
            background-color: #34495e;
            color: white;
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
            font-weight: bold;
        }

        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .personne-cell {
            background-color: #f8f9fa;
            font-weight: bold;
            text-align: left;
        }

        .present {
            color: #27ae60;
            font-weight: bold;
            font-size: 14px;
        }

        .absent {
            color: #e74c3c;
            font-weight: normal;
        }

        .footer {
            margin-top: 30px;
            text-align: right;
            font-size: 10px;
            color: #7f8c8d;
            border-top: 1px solid #ecf0f1;
            padding-top: 10px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 11px;
        }
    </style>
</head>
<body>
<h1 th:text="${titre}">Tableau des Choix</h1>

<div class="subtitle">
    Généré le : <span th:text="${#dates.format(dateGeneration, 'dd/MM/yyyy HH:mm')}"></span>
</div>

<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>Personne</th>
            <th th:each="plat : ${plats}"
                th:text="${plat}">Plat</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="personne : ${personnes}">
            <td class="personne-cell" th:text="${personne.nom}">Nom</td>
            <td th:each="choix : ${personne.choix}">
                <span th:if="${choix == 'X'}" class="present">X</span>
                <span th:unless="${choix == 'X'}" class="absent">--</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="footer">
    Document généré automatiquement - Système de gestion des repas
</div>
</body>
</html>
